[package]
name = "rust_auth_system"
version = "0.1.0"
edition = "2024"

# **Esto es una librería y nada más.**
#
# Un servicio en Rust se trae la identidad dentro y deja de tener que hablar con
# nadie por la red: montar sesiones, refresh y permisos se hace una vez y se
# reutiliza.
#
# El servicio suelto que responde `/auth/verify` a un proxy inverso —para las
# plataformas que no son Rust— vive en el proyecto **SSO**, que es quien se
# ocupa de integrar esto con varias plataformas. Aquí no hay binario a
# propósito: un componente que además se levanta solo acaba siendo dos cosas y
# ninguna del todo.
[lib]
name = "rust_auth_system"
path = "src/lib.rs"

[dependencies]
# Web y Actix
actix-web = "4"
actix-http = "3"
actix-service = "2"
actix-cors = "0.7.0"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Seguridad
jsonwebtoken = "9"

# argon2id para las contraseñas nuevas. `Argon2::default()` son los parámetros
# recomendados hoy (19 MiB, 2 pasadas, 1 hilo) y viajan dentro del propio hash, así
# que subirlos mañana no invalida los de hoy.
#
# 0.5 y `rand` 0.8 van juntos: argon2 0.5 depende de `rand_core` 0.6, que es el que
# usa rand 0.8. Subir uno obliga a subir el otro.
argon2 = "0.5"

# **bcrypt se queda solo para verificar.** No se cifra nada nuevo con él desde el
# 2026-09-08; sigue aquí porque hay hashes viejos en bases que ya existen, y quitarlo
# obligaria a que todo el mundo restablezca su contraseña. `passwords::verificar` los
# acepta y los rehace en el primer login correcto, que es el único instante en que se
# puede migrar sin conocer la contraseña. Cuando no queden `$2` en ninguna base, fuera.
bcrypt = "0.15"

# El resumen del token de refresco va con clave (`REFRESH_TOKEN_PEPPER`), no con un
# SHA-256 pelado. Ver `auth::handler_auth::resumen_refresh`.
hmac = "0.12"

# Base de datos
#
# 0.8 y no 0.7: la 0.7.4 arrastraba código que una versión futura de Rust va a
# rechazar (`cargo report future-incompatibilities`), y además alinea con el visor
# de infraestructura, que ya usa 0.8.6 — dos servicios que van a hablar de la
# misma base no deberían diferir en el driver.
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "json"] }
# Utilidades y otros
dotenv = "0.15"
futures = "0.3"
env_logger = "0.10"
log = "0.4"
time = "0.3"

# **Sin `bigdecimal` ni `rust_decimal` desde el 2026-09-08.** Los usaba una sola
# cosa: el `salary` de `auth.employers`. Al irse la ficha de empleado no queda en
# la identidad ningún número que necesite precisión arbitraria, y con ellos se va
# también la trampa que estaba anotada aquí — que la feature `bigdecimal` de sqlx
# 0.8 se compila contra la 0.4 y tener dos versiones del tipo en el árbol da un
# error que habla de `FromRow` cuando lo que falla es la versión.

# **Sin `utoipa` ni `utoipa-swagger-ui` desde el 2026-09-01.** No los importaba
# ni una línea de `src/`, y su script de compilación se descarga Swagger UI con
# `curl`: en una imagen de Docker sin curl, el build de cualquier consumidor
# fallaba por una dependencia que no se usaba.
#
# Servir documentación interactiva es de un servicio, no de una librería. Si hace
# falta, su sitio es el SSO.
