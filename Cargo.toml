[package]
name = "core_suite"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web y Actix
actix-web = "4"
actix-http = "3"
actix-service = "2"
actix-cors = "0.7.0"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"
# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Seguridad
jsonwebtoken = "9"
bcrypt = "0.15"

# Base de datos
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "json", "bigdecimal", "rust_decimal"] }
# Utilidades y otros
dotenv = "0.15"
futures = "0.3"
env_logger = "0.10"
log = "0.4"
time = "0.3"

rust_decimal = "1"
rust_decimal_macros = "1"
bigdecimal = { version = "0.3", features = ["serde"] }

# Dependencias de documentación

# Documentación
utoipa = { version = "5.4.0", features = ["uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["actix-web"] }
